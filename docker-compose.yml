services:
  db:
    image: mysql:8.0
    container_name: chn_test_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chn_test
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./SQL_Script/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./be_test
    container_name: chn_test_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: chn_test
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: VgfOMqVe/hFiKMwT8YBSFWjNwIctj67VALC0pKhG/PA=
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./fe-test
    container_name: chn_test_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
