<div class="page">
  <div class="header">
    <h2>Clientes</h2>
    <button mat-flat-button color="primary" (click)="newClient()">Nuevo cliente</button>
  </div>

  @if (showForm()) {
    <form (ngSubmit)="save()" #f="ngForm" class="form-card">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput name="name" [(ngModel)]="form.name" required />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Apellido</mat-label>
        <input matInput name="lastName" [(ngModel)]="form.lastName" required />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Fecha de nacimiento</mat-label>
        <input matInput type="date" name="birthday" [(ngModel)]="form.birthday" required />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Correo</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="form.email" required />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Telefono</mat-label>
        <input matInput name="phoneNumber" [(ngModel)]="form.phoneNumber" required />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Direccion</mat-label>
        <input matInput name="address" [(ngModel)]="form.address" />
      </mat-form-field>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <div class="form-actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="f.invalid">Guardar</button>
        <button mat-button type="button" (click)="cancel()">Cancelar</button>
      </div>
    </form>
  }

  <table mat-table [dataSource]="clients()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let c">{{ c.name }} {{ c.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Correo</th>
      <td mat-cell *matCellDef="let c">{{ c.email }}</td>
    </ng-container>

    <ng-container matColumnDef="phoneNumber">
      <th mat-header-cell *matHeaderCellDef>Telefono</th>
      <td mat-cell *matCellDef="let c">{{ c.phoneNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef>Activo</th>
      <td mat-cell *matCellDef="let c">{{ c.active ? 'Si' : 'No' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let c">
        <a mat-button [routerLink]="['/clients', c.id, 'loans']">Prestamos</a>
        <button mat-icon-button (click)="edit(c)" title="Editar"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button (click)="remove(c)" [disabled]="!c.active" title="Desactivar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[5, 10, 25]"
    (page)="onPage($event)"
  ></mat-paginator>
</div>
