<div class="auth-page">
  <mat-card>
    <mat-card-title>Crear cuenta</mat-card-title>
    <form (ngSubmit)="submit()" #form="ngForm">
      <mat-form-field appearance="outline">
        <mat-label>Usuario</mat-label>
        <input matInput name="username" [(ngModel)]="username" required minlength="3" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Correo electronico</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="email" required />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="password" required minlength="8" />
      </mat-form-field>
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Registrarme</button>
    </form>
    <p><a routerLink="/login">Ya tengo una cuenta</a></p>
  </mat-card>
</div>
